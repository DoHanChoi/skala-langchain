services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rolelens}
      POSTGRES_USER: ${POSTGRES_USER:-rolelens_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rolelens_local_owner}
      POSTGRES_AGENT_PASSWORD: ${POSTGRES_AGENT_PASSWORD:-rolelens_local_readonly}
      TZ: Asia/Seoul
      PGTZ: Asia/Seoul
    ports:
      - "${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - rolelens_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rolelens_owner} -d ${POSTGRES_DB:-rolelens}"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

volumes:
  rolelens_pgdata:
